---
# Each platform downloads jq and everything it needs from its own repositories in prepare, as
# someone would bring package files in, and the files go to the control node with the
# distribution's signing keys. Then the role pushes and installs them with the repositories
# switched off, checking RPM signatures (after importing the keys) and DEB checksums, and a
# second run must push nothing.
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the test package
      ansible.builtin.command:
        argv: "{{ __test_command | default(['jq', '--null-input', '--compact-output', '{installed: true}']) }}"
      register: __verify_jq
      changed_when: false

    - name: Look for the files on the host
      ansible.builtin.stat:
        path: /var/tmp/standalone-package-installer
      register: __verify_dir

    - name: Check the test package works and the files are gone
      ansible.builtin.assert:
        that:
          - __test_output | default('{"installed":true}') in __verify_jq.stdout
          - not __verify_dir.stat.exists
        quiet: true

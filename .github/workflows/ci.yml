---
name: CI

# Pull requests and main: scan for secrets, lint, then run every Molecule scenario on its
# platforms in parallel. Each job calls the same just recipe a
# local run would.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # From the release's checksums file. Dependabot cannot update a pinned download, so bump
  # both together when moving to a new gitleaks release.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  JUST_VERSION: 1.59.0

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so a secret added and later removed is still found.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint
        run: uvx --from "rust-just==${JUST_VERSION}" just lint

  molecule:
    name: Molecule (${{ matrix.scenario }}, ${{ matrix.platform }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: default, platform: rhel8 }
          - { scenario: default, platform: rhel9 }
          - { scenario: default, platform: rocky10 }
          - { scenario: default, platform: debian12 }
          - { scenario: default, platform: debian13 }
          - { scenario: default, platform: ubuntu2404 }
          - { scenario: default, platform: ubuntu2604 }
          - { scenario: default, platform: sles15 }
          - { scenario: default, platform: sles16 }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run the scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
          PLATFORM: ${{ matrix.platform }}
        run: uvx --from "rust-just==${JUST_VERSION}" just test "$SCENARIO" "$PLATFORM"

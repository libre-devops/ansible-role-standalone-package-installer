# Development tools only. The role itself has no Python dependencies.
[project]
name = "ansible-role-standalone-package-installer"
version = "0.0.0"
description = "Development tools for the libre_devops.standalone_package_installer Ansible role"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ansible-core>=2.21,<2.22",
  "ansible-lint>=26.10,<27",
  "molecule>=26.10,<27",
  "molecule-plugins[podman]>=26.10,<27",
  "yamllint>=1.38,<2",
  "zizmor>=1.16,<2",
]

[tool.uv]
package = false

# Only resolve releases at least a week old, so a freshly published bad release is not picked up.
exclude-newer = "7 days"
